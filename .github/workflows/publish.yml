# Blog auto-publish deploy. Triggered ONLY by workflow_dispatch (the n8n Publisher
# workflow calls this after Connor approves a post). Normal git pushes do NOT deploy;
# local `npm run deploy` remains the manual path.
name: publish-site
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "What triggered this deploy"
        required: false
        default: "n8n blog publish"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Setup Chrome (featured-image rendering)
        uses: browser-actions/setup-chrome@v1

      - name: Render featured SVGs to PNG
        run: |
          mkdir -p public/blog
          shopt -s nullglob
          for svg in assets-src/blog-featured/*.svg; do
            slug=$(basename "$svg" .svg)
            png="public/blog/$slug.png"
            if [ ! -f "$png" ]; then
              echo "rendering $slug"
              chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
                --window-size=1200,1200 --screenshot="$png" "file://$PWD/$svg" || \
              google-chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
                --window-size=1200,1200 --screenshot="$png" "file://$PWD/$svg"
            fi
          done

      - name: Build
        run: npx astro build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=22-local-marketing --branch=main
